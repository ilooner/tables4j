name: Publish release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Existing release tag to attach missing JARs to (for example, v0.1.0)'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: publish-${{ github.event.release.tag_name || inputs.release_tag }}
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'ilooner/tables4j'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      packages: write
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name || inputs.release_tag }}
    steps:
      - name: Check out the release
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: refs/tags/${{ github.event.release.tag_name || inputs.release_tag }}
          persist-credentials: false

      - name: Set up Java 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5.0.2

      - name: Verify the release version and build
        run: ./gradlew verifyReleaseVersion build -PreleaseTag="$RELEASE_TAG" --warning-mode all --console=plain

      - name: Attach missing JARs to the GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version="${RELEASE_TAG#v}"
          artifacts=(
            "build/libs/tables4j-${version}.jar"
            "build/libs/tables4j-${version}-sources.jar"
            "build/libs/tables4j-${version}-javadoc.jar"
          )
          for artifact in "${artifacts[@]}"; do
            test -f "$artifact"
          done
          existing_assets="$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name')"
          for artifact in "${artifacts[@]}"; do
            asset_name="${artifact##*/}"
            if grep -Fxq -- "$asset_name" <<< "$existing_assets"; then
              echo "Asset already exists: $asset_name"
            else
              gh release upload "$RELEASE_TAG" "$artifact" --repo "$GITHUB_REPOSITORY"
            fi
          done

      - name: Publish to GitHub Packages
        if: github.event_name == 'release'
        run: ./gradlew publishMavenJavaPublicationToGitHubPackagesRepository -PreleaseTag="$RELEASE_TAG" --warning-mode all --console=plain
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
